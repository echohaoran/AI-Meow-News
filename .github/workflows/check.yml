# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check on the empty database, and the Docker image brought up with docker compose.
# Only GitHub-owned actions, pinned to a full commit SHA.
name: Check (manual)
# Project execution for the current delivery stays on homelab. Remote CI is opt-in.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:43181
      API_BASE_URL: http://127.0.0.1:43182
      API_PORT: 43182
      WEB_PORT: 43181
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        # New migrations against the PR base: deployed ones unchanged, no whole-table rewrite or blocking index in a release.
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: PostgreSQL backup tools
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Web tests
        run: node --test apps/web/tests/*.test.ts

      # Each test file runs on its own copy of aihot_ci (tests/databases.ts), which the run migrates and
      # leaves empty; the smoke check then reads that empty database.
      - name: Backend tests
        run: npm test
      - name: Smoke check of the built site
        # The site itself runs with collection and model calls off (the tests above use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:43181/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:43181
          node scripts/mcp-check.ts http://127.0.0.1:43181/api/mcp
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          mkdir -p "$RUNNER_TEMP/ai-news/data"
          # Disposable CI-only values; never production credentials.
          cat > "$RUNNER_TEMP/ai-news/backend.env" <<'ENV'
          DATABASE_URL=postgres://ainews:ci-only-password@db:43183/ainews
          ADMIN_PASSWORD=ci-only-admin-password
          SESSION_SECRET=ci-session-secret-0123456789abcdef
          IMG_PROXY_SIGN_SECRET=ci-image-secret-0123456789abcdef
          MODEL_CALLS_ENABLED=false
          COLLECT_ENABLED=false
          MCP_ALLOWED_HOSTS=web
          ENV
          cat > "$RUNNER_TEMP/ai-news/compose.env" <<ENV
          AI_NEWS_IMAGE=ainews-local:ci
          AIHOT_RELEASE=ci
          AI_NEWS_BACKEND_ENV=$RUNNER_TEMP/ai-news/backend.env
          AI_NEWS_DATA_DIR=$RUNNER_TEMP/ai-news/data
          POSTGRES_PASSWORD=ci-only-password
          SITE_URL=http://127.0.0.1:43180
          INGRESS_BIND=127.0.0.1
          ENV
          sudo chown 1000:1000 "$RUNNER_TEMP/ai-news/data"
      - name: Build, migrate, seed and start
        run: |
          docker build -t ainews-local:ci .
          dc() { docker compose --env-file "$RUNNER_TEMP/ai-news/compose.env" -f deploy/portable/compose.yaml "$@"; }
          dc config --quiet
          dc up -d db
          dc --profile tools run --rm migrate
          dc --profile tools run --rm migrate node scripts/seed.ts
          dc up -d api web ingress
      - name: Smoke check
        run: |
          dc() { docker compose --env-file "$RUNNER_TEMP/ai-news/compose.env" -f deploy/portable/compose.yaml "$@"; }
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:43180/api/health 2>/dev/null && break; sleep 2; done
          dc ps
          dc --profile tools run --rm --no-deps migrate node scripts/smoke.ts --base http://web:43181
          dc exec -T db psql -p 43183 -U ainews -d ainews -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Logs
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/ai-news/compose.env" -f deploy/portable/compose.yaml logs --tail 80
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/ai-news/compose.env" -f deploy/portable/compose.yaml down -v
